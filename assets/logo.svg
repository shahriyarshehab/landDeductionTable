<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181436"/>
      <stop offset="50%" stop-color="#0E0B24"/>
      <stop offset="100%" stop-color="#070514"/>
    </linearGradient>

    <!-- Primary Brand Violet Gradient -->
    <linearGradient id="violetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B7CFF"/>
      <stop offset="100%" stop-color="#5A44E0"/>
    </linearGradient>

    <!-- Cyan Teal Accent Gradient -->
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#33E0C7"/>
      <stop offset="100%" stop-color="#12B8A3"/>
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="100%" stop-color="#F5C24D"/>
    </linearGradient>

    <!-- Glassmorphic Overlay Gradient -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.16)"/>
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.03)"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Container Box with Rounded Squircle Shape -->
  <rect x="16" y="16" width="480" height="480" rx="100" fill="url(#bgGrad)" filter="url(#shadow)"/>
  <rect x="16" y="16" width="480" height="480" rx="100" fill="none" stroke="url(#glassGrad)" stroke-width="3"/>

  <!-- Ambient Glow Elements -->
  <circle cx="256" cy="220" r="140" fill="url(#violetGrad)" opacity="0.25" filter="url(#glow)"/>
  <circle cx="200" cy="280" r="90" fill="url(#tealGrad)" opacity="0.2" filter="url(#glow)"/>

  <!-- ── CADASTRAL LAND SURVEY PLOT MATRIX & DIGITAL PRISM ── -->
  <g filter="url(#shadow)">
    <!-- Outer Land Plot Hexagonal Prism Boundary -->
    <polygon points="256,90 380,162 380,306 256,378 132,306 132,162" fill="url(#glassGrad)" stroke="url(#violetGrad)" stroke-width="6" stroke-linejoin="round"/>

    <!-- Plot Sub-Deduction Polygons (Representing Land Divisions) -->
    <!-- Top Right Land Parcel -->
    <polygon points="256,90 380,162 256,234 132,162" fill="url(#violetGrad)" opacity="0.45"/>
    
    <!-- Left Land Deduction Polygon -->
    <polygon points="132,162 256,234 256,378 132,306" fill="url(#violetGrad)" opacity="0.75"/>

    <!-- Right Land Deduction Polygon (Teal Growth Highlight) -->
    <polygon points="256,234 380,162 380,306 256,378" fill="url(#tealGrad)" opacity="0.85"/>

    <!-- Dynamic Cadastral Grid Lines -->
    <line x1="256" y1="90" x2="256" y2="378" stroke="rgba(255,255,255,0.6)" stroke-width="3" stroke-dasharray="6 6"/>
    <line x1="132" y1="162" x2="380" y2="306" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>
    <line x1="380" y1="162" x2="132" y2="306" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>

    <!-- Inclusive Growth Leaf Accent Overlay -->
    <path d="M256 180 C310 180 340 220 340 270 C340 320 290 350 256 350 C256 300 280 270 256 240 C232 270 256 300 256 350 C222 350 172 320 172 270 C172 220 202 180 256 180 Z" fill="url(#tealGrad)" opacity="0.35"/>

    <!-- Central Benchmark Point (Precision Datum Node) -->
    <circle cx="256" cy="234" r="22" fill="url(#goldGrad)" stroke="#FFFFFF" stroke-width="4" filter="url(#glow)"/>
    <circle cx="256" cy="234" r="8" fill="#181436"/>

    <!-- Plot Survey Vertices (Corner Nodes) -->
    <circle cx="256" cy="90" r="9" fill="url(#tealGrad)" stroke="#FFFFFF" stroke-width="2"/>
    <circle cx="380" cy="162" r="9" fill="url(#violetGrad)" stroke="#FFFFFF" stroke-width="2"/>
    <circle cx="380" cy="306" r="9" fill="url(#tealGrad)" stroke="#FFFFFF" stroke-width="2"/>
    <circle cx="256" cy="378" r="9" fill="url(#goldGrad)" stroke="#FFFFFF" stroke-width="2"/>
    <circle cx="132" cy="306" r="9" fill="url(#violetGrad)" stroke="#FFFFFF" stroke-width="2"/>
    <circle cx="132" cy="162" r="9" fill="url(#tealGrad)" stroke="#FFFFFF" stroke-width="2"/>
  </g>

  <!-- Branding Text Typography -->
  <text x="256" y="432" font-family="'Inter', 'Anek Bangla', sans-serif" font-weight="900" font-size="34" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">LDD4IG</text>
  <text x="256" y="458" font-family="'Inter', 'Hind Siliguri', sans-serif" font-weight="600" font-size="14" fill="url(#tealGrad)" text-anchor="middle" letter-spacing="2">LAND DATA DIGITALIZATION</text>
</svg>
